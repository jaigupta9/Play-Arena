<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tic Tac Toe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Site-wide styles first -->
    <link rel="stylesheet" href="../styles.css" />
    <!-- Page-specific styles second -->
    <link rel="stylesheet" href="tic-tac-toe.css" />
</head>

<body>
    <!-- Shared Navbar -->
    <header>
        <nav class="navbar">
            <a href="../index.html" class="logo" aria-label="Play Arena Home">🎮 Play Arena</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../about.html">About</a>
                <a href="#">Leaderboard</a>
                <a href="#">Contact</a>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">🌙</button>
            </div>
        </nav>
    </header>

    <main class="container" style="padding: 24px 16px;">
        <section class="featured" style="margin-top: 24px;">
            <h2 style="margin-bottom: 8px;">🎯 Tic Tac Toe</h2>
            <p style="margin-top: 0; color: #555;">Test logic and timing in this classic 3×3 duel.</p>
        </section>

        <!-- Game card -->
        <section class="ttt-card">
            <div class="scoreboard">
                <p>Player X: <span id="scoreX">0</span></p>
                <p>Player O: <span id="scoreO">0</span></p>
            </div>

            <p id="status" class="status" aria-live="polite">Turn: X</p>

            <!-- Game board -->
            <div class="board" id="board" aria-label="Tic Tac Toe board" role="grid"></div>

            <!-- Actions -->
            <div class="actions">
                <a href="../index.html" class="btn" style="margin-right: 8px;">⬅ Back to Menu</a>
                <button id="resetBtn" class="btn">🔄 Restart Game</button>
            </div>
        </section>

        <!-- Modal -->
        <div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="modalText">
            <div class="modal-content">
                <p id="modalText"></p>
                <button id="modalBtn" class="btn">Play Again</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 Play Arena | Made by Jai</p>
    </footer>

    <!-- Page script (navbar helpers + game logic) -->
    <script defer src="tic-tac-toe.js"></script>
</body>

</html>
